[project]
name = "sec-import"
version = "0.1.0"
description = "Source importers for the System Engineering Cockpit knowledge graph"
requires-python = ">=3.11"
dependencies = [
    # Both driver majors work: the importer uses only GraphDatabase.driver, session,
    # execute_write and ManagedTransaction, none of which changed in 6.0. Left open at the
    # top so a company mirror that carries only one of the two can still resolve it.
    "neo4j>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
sec-import-doors = "sec_import.doors.cli:main"
sec-import-windchill = "sec_import.windchill.cli:main"
sec-import-cameo = "sec_import.cameo.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# The DOORS importer keeps its tests next to the code it tests, which is where they arrived
# from the standalone project. Both roots are listed so `pytest` with no arguments runs
# everything — a test suite you have to remember a path to is a test suite that stops running.
testpaths = ["tests", "src/sec_import/doors/tests"]
