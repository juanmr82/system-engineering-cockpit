<h2 mat-dialog-title class="sec-confirm__title">{{ data.title }}</h2>

<mat-dialog-content>
  <p class="sec-confirm__message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="close(false)">{{ data.cancelLabel ?? 'Cancel' }}</button>
  <button mat-flat-button type="button" (click)="close(true)">{{ data.confirmLabel }}</button>
</mat-dialog-actions>
