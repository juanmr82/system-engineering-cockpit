<nav class="sec-sidenav" aria-label="Primary">
  <sec-logo />
  @for (group of groups(); track group.key) {
    <div class="sec-sidenav__group-label">{{ group.label }}</div>
    <mat-nav-list>
      @for (item of group.items; track item.key) {
        <a
          mat-list-item
          class="sec-sidenav__item"
          [routerLink]="item.route"
          routerLinkActive="sec-sidenav__item--active"
        >
          <span matListItemTitle>{{ item.label }}</span>
          @if (item.badge) {
            <span matListItemMeta class="sec-sidenav__badge">{{ item.badge }}</span>
          }
        </a>
      }
    </mat-nav-list>
  }
</nav>
