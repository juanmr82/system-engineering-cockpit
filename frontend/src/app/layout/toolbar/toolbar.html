<mat-toolbar class="sec-toolbar">
  <span class="sec-toolbar__spacer"></span>

  <!-- Settings is a menu into a route rather than a dialog: it holds a project multi-select, a
       field picker over the whole catalogue and an import console, none of which fit in a panel,
       and each needs a URL an error message can link to (spec §13.1). -->
  <button
    mat-icon-button
    class="sec-toolbar__action"
    [matMenuTriggerFor]="settingsMenu"
    matTooltip="Settings"
    aria-label="Settings menu"
  >
    <mat-icon svgIcon="gearbox" />
  </button>
  <mat-menu #settingsMenu="matMenu">
    <a mat-menu-item routerLink="/settings/jira">JIRA</a>
    <a mat-menu-item routerLink="/settings/windchill">Windchill</a>
    <a mat-menu-item routerLink="/settings/importers">Importers and runs</a>
  </mat-menu>

  <button
    mat-icon-button
    class="sec-toolbar__action"
    [matMenuTriggerFor]="userMenu"
    aria-label="Account menu"
  >
    <mat-icon svgIcon="account-circle" />
  </button>
  <mat-menu #userMenu="matMenu">
    @if (user(); as u) {
      <button mat-menu-item disabled class="sec-toolbar__user-name">{{ u.displayName }}</button>
      <button mat-menu-item disabled class="sec-toolbar__user-detail">{{ u.email }}</button>
      <button mat-menu-item disabled class="sec-toolbar__user-detail">
        Roles: {{ u.roles.length ? u.roles.join(', ') : 'None' }}
      </button>
      <!-- "Why can I not see this module" is answered by this list nine times out of ten
           (CLAUDE.md §9) — a user in no group sees an application with nothing in it, by design
           (R8), and this is where they find out why. -->
      <button mat-menu-item disabled class="sec-toolbar__user-detail">
        @if (u.groups.length) {
          Groups: {{ u.groups.join(', ') }}
        } @else {
          Not in any group — nothing is visible yet
        }
      </button>
      <button mat-menu-item (click)="signOut()">Sign out</button>
    } @else {
      <button mat-menu-item disabled>Signed in</button>
    }
  </mat-menu>
</mat-toolbar>
