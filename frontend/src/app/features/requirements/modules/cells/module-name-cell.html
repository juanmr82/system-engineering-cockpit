<span class="sec-module-name-cell">
  <!-- The gear leads, so every row's icon sits at the same x. Trailing the name put it wherever
       that row's text happened to end, which reads as a ragged column of misplaced buttons rather
       than as a control. The name is what varies in length, so the name is what goes second. -->
  <button
    mat-icon-button
    type="button"
    class="sec-module-name-cell__settings"
    [attr.aria-label]="'Settings for ' + name()"
    matTooltip="Module settings"
    (click)="openSettings()"
  >
    <mat-icon svgIcon="gearbox" />
  </button>
  <span class="sec-module-name-cell__name">{{ name() }}</span>
</span>
