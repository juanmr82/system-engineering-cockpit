<span class="sec-module-name-cell">
  <span class="sec-module-name-cell__name">{{ name() }}</span>
  <!-- Pushed to the cell's right edge by `margin-inline-start: auto`, not left sitting after the
       text. Trailing the name directly, the gear landed wherever that row's text happened to end —
       a ragged column of buttons. Against the right edge of a content-sized column every row's
       gear is at the same x, and the name still comes first, which is the order it reads in. -->
  <button
    mat-icon-button
    type="button"
    class="sec-module-name-cell__settings"
    [attr.aria-label]="'Settings for ' + name()"
    matTooltip="Module settings"
    (click)="openSettings()"
  >
    <mat-icon svgIcon="gearbox" />
  </button>
</span>
