@if (checkingAccess()) {
  <mat-progress-bar mode="indeterminate" />
} @else if (!canManage()) {
  <sec-refusal-panel title="Grants" />
} @else {
  <div class="sec-access-grants">
    <header class="sec-access-grants__header">
      <p class="sec-access-grants__eyebrow">Access</p>
      <h1 class="sec-access-grants__title">Grants</h1>
    </header>

    @if (loading() && !(api.groups.hasValue() && api.categories.hasValue())) {
      <mat-progress-bar mode="indeterminate" />
    } @else if (loadError()) {
      <div class="sec-access-grants__error" role="alert">
        <p>Couldn't load groups and categories.</p>
        <button mat-stroked-button type="button" (click)="retry()">Retry</button>
      </div>
    } @else {
      <div class="sec-access-grants__table-scroll sec-grid sec-grid--middle">
        <ag-grid-angular
          class="sec-access-grants__grid"
          [gridOptions]="gridOptions"
          [columnDefs]="columnDefs()"
          [rowData]="rows()"
          [context]="cellContext"
          [getRowId]="getRowId"
          (gridReady)="onGridReady($event)"
        />
      </div>
    }
  </div>
}
