<div class="sec-settings">
  <header class="sec-settings__header">
    <p class="sec-settings__eyebrow">Administration</p>
    <h1 class="sec-settings__title">Settings</h1>
  </header>

  <mat-tab-group
    class="sec-settings__tabs"
    [selectedIndex]="selectedIndex()"
    (selectedIndexChange)="onTabChange($event)"
    [preserveContent]="true"
  >
    <mat-tab label="JIRA integration">
      <sec-jira-integration />
    </mat-tab>
  </mat-tab-group>
</div>
