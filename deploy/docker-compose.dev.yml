# Local dev only. Neo4j Community — no RBAC, no property-existence constraints, no query
# governor; see CLAUDE.md §7 for what that means for the backend and importers.
services:
  neo4j:
    image: neo4j:2026.01-community
    container_name: sec-neo4j-dev
    ports:
      - "7474:7474" # HTTP browser
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${SEC_NEO4J_PASSWORD:?set SEC_NEO4J_PASSWORD before starting}"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - sec-neo4j-data:/data
      - sec-neo4j-logs:/logs

  # ADR 0016 / ADR 0017 / docs/KEYCLOAK_SETUP.md. Imports the committed realm export so the realm,
  # the sec-backend client, the four roles and the three test users are identical for everyone —
  # nobody clicks through the admin console to stand this up. Port 8081, not 8080: the backend
  # already owns 8080, and KEYCLOAK_SETUP.md §2's dev redirect URI assumes this exact mapping.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: sec-keycloak-dev
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: "${SEC_KEYCLOAK_ADMIN_PASSWORD:?set SEC_KEYCLOAK_ADMIN_PASSWORD before starting}"
    volumes:
      - ./keycloak/sec-realm.json:/opt/keycloak/data/import/sec-realm.json:ro

volumes:
  sec-neo4j-data:
  sec-neo4j-logs:
