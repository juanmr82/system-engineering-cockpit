# The SEC login theme.
#
# `parent=keycloak.v2` inherits every template, message and behaviour from the stock theme and
# overrides only what is listed here. That is the whole design: this theme owns a stylesheet and
# a logo, and nothing else.
#
# The alternative — copying the .ftl templates in and editing them — is what makes a Keycloak
# upgrade painful, because every copied template is frozen at the version it was copied from and
# silently misses new fields (a new MFA prompt, a new terms checkbox). Do not copy a template
# unless you genuinely need to change its structure, and write down why if you do.
#
# keycloak.v2 is the current login theme in Keycloak 24+. The old `keycloak` theme still exists
# and is deprecated; inheriting from it means inheriting a design that will be removed.
parent=keycloak.v2
import=common/keycloak

# Appended to the parent's own styles, so the stock stylesheet still loads and this only overrides.
# Order matters: the parent's come first.
styles=css/login.css

# The logo shown above the login card. Swap the file, keep the name.
logo=img/sec-logo.svg

# Keycloak reads these to decide what the login page offers. Left at the parent's values on
# purpose — they are realm behaviour, not styling, and belong in the realm settings where an
# administrator can see them.
