# Committed so every deployer's run behaves identically, whatever is in their ~/.ansible.cfg.
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
# The default (linear) is right for one host; naming it stops a site-wide setting changing it.
strategy = linear
# Show what changed in a template rather than only that it changed — the difference between a
# reviewable deploy and a hopeful one.
stdout_callback = yaml
display_skipped_hosts = False
retry_files_enabled = False
# The vault passphrase, if you keep it in a file. 0600, and never in the repository.
# vault_password_file = ~/.sec-vault-pass

[privilege_escalation]
become = False

[ssh_connection]
pipelining = True
