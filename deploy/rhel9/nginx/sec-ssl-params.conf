# /etc/nginx/conf.d/sec-ssl-params.conf
#
# TLS settings, kept apart from the vhost so there is one place to change them and no chance of
# two server blocks disagreeing.
#
# Included by sec.conf. Not a server block itself — it holds directives only.

# TLS 1.2 and 1.3. Not 1.0/1.1: RHEL 9's system-wide crypto policy already refuses them, and
# stating it here means the vhost does not silently depend on that policy staying DEFAULT.
ssl_protocols TLSv1.2 TLSv1.3;

# 1.3 suites are not configurable through ssl_ciphers and are fine as they come. This list is the
# 1.2 fallback: forward secrecy only, AEAD only, no RSA key exchange, no CBC.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;

ssl_session_cache   shared:SecSSL:10m;
ssl_session_timeout 1d;
# Off deliberately: tickets without rotation undermine forward secrecy, and nginx does not rotate
# the key on its own.
ssl_session_tickets off;

# OCSP stapling is deliberately ABSENT, and whether to turn it on depends on your PKI: it needs an
# OCSP responder URL in the certificate AND a resolver nginx can reach. Without both,
# `ssl_stapling on` logs a warning on every reload and staples nothing. Check for an
# "OCSP - URI" in `openssl x509 -text`, and turn it on only if there is one.
