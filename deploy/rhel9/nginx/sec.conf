# /etc/nginx/conf.d/sec.conf
#
# One hostname serves everything: the UI, the API, and Keycloak under /auth. That is deliberate —
# the session cookie is SameSite=Lax, and a single origin keeps the login redirect same-site all
# the way through.
#
#   install -o root -g root -m 0644 sec.conf /etc/nginx/conf.d/
#   nginx -t && systemctl reload nginx
#
# Replace sec.example.corp throughout. The certificate paths are where the Ansible role installs
# the bundle your PKI issued; see docs/DEPLOY_RHEL9.md §5.
#
# This file is the READABLE REFERENCE COPY. The playbook templates it (roles/sec_nginx) so the
# hostname, ports and upload limit come from group_vars — edit both, or edit this and re-generate.

# --- rate limiting -------------------------------------------------------------------------------
# Applied to the endpoint a BROWSER posts credentials to, which is the brute-force surface and
# where a per-client-address limit means something.
#
# Deliberately NOT the token endpoint. That one is called by the backend, server to server, for
# every code exchange and every session refresh — always from 127.0.0.1, so a per-address limit
# would put the entire user population in one bucket and rate-limit the application against
# itself. Keycloak's own brute-force protection (realm setting, enabled in sec-realm-prod.json) is
# the real defence here; this is one cheap layer in front of it.
limit_req_zone $binary_remote_addr zone=sec_login:10m rate=10r/s;

upstream sec_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream sec_keycloak {
    server 127.0.0.1:8180;
    keepalive 16;
}

# --- http: redirect, and nothing else --------------------------------------------------------------
server {
    listen      80;
    listen      [::]:80;
    server_name sec.example.corp;

    # No exception for ACME: the certificate comes from the company PKI, not from a challenge, so
    # there is nothing to serve here. Add one if that ever changes.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name sec.example.corp;

    # --- TLS ------------------------------------------------------------------------------------
    ssl_certificate     /etc/pki/tls/certs/sec.example.corp.crt;
    ssl_certificate_key /etc/pki/tls/private/sec.example.corp.key;
    include             /etc/nginx/conf.d/sec-ssl-params.conf;

    # HSTS. Safe here because this host is https-only (the :80 server above only redirects).
    # No `preload`, and no `includeSubDomains` unless every sibling host is also https — that
    # directive reaches names this certificate has never heard of.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- security headers ---------------------------------------------------------------------------
    add_header X-Content-Type-Options    "nosniff"        always;
    add_header X-Frame-Options           "DENY"           always;
    add_header Referrer-Policy           "same-origin"    always;
    add_header Cross-Origin-Opener-Policy "same-origin"   always;

    # The Angular bundle needs 'unsafe-inline' for its injected styles; script-src does not.
    # 'wasm-unsafe-eval' is absent on purpose — nothing here uses WebAssembly, and elkjs runs as a
    # plain worker. Tighten to a nonce if the app ever grows a server-rendered shell.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- uploads --------------------------------------------------------------------------------------
    # THE most likely first failure on a real deployment. A DOORS module export is several
    # megabytes (the committed SRD fixture alone is 4.2 MB) and POST /api/v1/doors/import sends the
    # whole file. nginx's default client_max_body_size is 1m, and it rejects the request with a 413
    # that never reaches the backend — so the import screen reports a failure the backend log knows
    # nothing about.
    client_max_body_size 64m;
    client_body_timeout  300s;

    access_log /var/log/nginx/sec.access.log;
    error_log  /var/log/nginx/sec.error.log;

    # --- Keycloak: what must NOT be reachable from the whole network -------------------------------
    # The reverse-proxy guide asks for the admin paths, health and metrics to be restricted, not
    # published: "Exposed admin paths lead to an unnecessary attack vector". Longer prefixes than
    # /auth/, so nginx matches these first.
    #
    # THE ADMIN CONSOLE. Restricted by source address rather than denied outright, because
    # KC_HOSTNAME_STRICT=true makes Keycloak build every URL from KC_HOSTNAME — so the console
    # reached any other way (an ssh tunnel to 127.0.0.1:8180, say) loads its HTML and then sends
    # the browser to https://<host>/auth/... anyway. Deny that and the console dead-ends. Restrict
    # it, and the same URL works for the people who should have it.
    #
    # `allow` lines are generated from sec_admin_allow_cidrs. WITH THE LIST EMPTY NOBODY GETS IN,
    # which is the correct state until somebody states the administration network — see
    # group_vars/all.yml.example for how to find yours.
    #
    # These act on $remote_addr, the real TCP peer, because nginx is the edge here. If a corporate
    # load balancer is ever put in front of it, every request will appear to come from the balancer
    # and this list stops meaning anything — revisit it then, with real_ip_module.
    location /auth/admin/ {
        allow 127.0.0.1;
        deny all;

        proxy_pass http://sec_keycloak;

        proxy_buffer_size        16k;
        proxy_buffers          8 16k;
        proxy_busy_buffers_size  32k;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # The administrative realm's own authentication endpoints — the console signs in through these,
    # so they carry the same allowlist rather than a blanket deny. SEC itself only ever uses the
    # `sec` realm, so nothing of the application passes through here.
    location /auth/realms/master/ {
        allow 127.0.0.1;
        deny all;

        proxy_pass http://sec_keycloak;

        proxy_buffer_size        16k;
        proxy_buffers          8 16k;
        proxy_busy_buffers_size  32k;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }

    # No allowlist on these two: nothing outside the host has any business reading them, and the
    # probes that do use the management port (9000) directly, which is not proxied at all.
    location /auth/health {
        deny all;
        return 403;
    }

    location /auth/metrics {
        deny all;
        return 403;
    }

    # --- Keycloak, under /auth ----------------------------------------------------------------------
    # KC_HTTP_RELATIVE_PATH=/auth on the Keycloak side makes the paths it generates match this
    # prefix. Do not add a rewrite here — Keycloak must build its own URLs, and a rewrite makes the
    # issuer in the token disagree with the URL the browser used, which fails validation in a way
    # that is very hard to read.
    location /auth/ {
        proxy_pass http://sec_keycloak;

        # Keycloak sets several large cookies (AUTH_SESSION_ID, KEYCLOAK_IDENTITY, KC_RESTART) and
        # the callback carries a token. nginx's default 4k/8k proxy buffers overflow on those and
        # answer 502 with "upstream sent too big header" — during the login redirect, so the
        # symptom is "login is broken" rather than anything pointing at a buffer. Not from the
        # Keycloak guide; it is an nginx default that this workload exceeds.
        proxy_buffer_size        16k;
        proxy_buffers          8 16k;
        proxy_busy_buffers_size  32k;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # The credential POST, rate limited. A longer prefix than /auth/, so nginx prefers it.
    location /auth/realms/sec/login-actions/authenticate {
        limit_req zone=sec_login burst=20 nodelay;

        proxy_pass http://sec_keycloak;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
    }

    # --- the import progress stream -------------------------------------------------------------------
    # Server-sent events (ktor-server-sse). Three things are all required and each fails
    # differently when missing:
    #   proxy_buffering off  — otherwise nginx holds events until its buffer fills and the progress
    #                          bar jumps from 0 to 100 at the end
    #   proxy_read_timeout   — the stream is idle between events; the 15s heartbeat keeps it alive,
    #                          but a long import phase can still exceed the 60s default
    #   HTTP/1.1 + no Connection: close — SSE over HTTP/1.0 is closed after the first event
    #
    # The path is ApiPaths.IMPORT_RUNS + "/{runId}/events" — one source-agnostic stream for every
    # importer (spec §11.4), so this stays one location however many sources are added.
    location ~ ^/api/v1/import/runs/[^/]+/events$ {
        proxy_pass http://sec_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_cache        off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- the API ----------------------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://sec_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr, NOT $proxy_add_x_forwarded_for. The latter APPENDS the peer to whatever
        # the client sent, and both Keycloak and Ktor's XForwardedHeaders read the LEFTMOST entry
        # — so a request carrying a forged `X-Forwarded-For: 1.2.3.4` would choose what this
        # application records about it. The loopback bind does not help: it stops a caller
        # bypassing nginx, not injecting a header through it. Keycloak's reverse-proxy guide says
        # the same in one line — "ensure the proxy overwrites (not just appends to) forwarded
        # headers". ForwardedHeadersTest pins which entry wins so this cannot regress quietly.
        #
        # This is also what `server.behindProxy: true` in sec.yaml reads (ADR 0021).
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_connect_timeout 10s;
        # Generous: an import runs synchronously inside POST /api/v1/doors/import until it hands
        # off, and a dependency-graph query over a large module is not instant.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }

    # --- the application itself ------------------------------------------------------------------------
    # The jar serves both the API and the UI, so everything else is proxied to the same place. The
    # backend already gets the two rules right that a static file server gets wrong: /api/** is
    # never answered with a page, and a missing *file* is a 404 rather than index.html
    # (UiRoutes.kt, PackagedUiTest).
    location / {
        proxy_pass http://sec_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        proxy_read_timeout 60s;
    }

    # Health, for a load balancer or a monitoring probe. Unauthenticated by design (ApiPaths.kt);
    # kept out of the access log because a 1-second probe drowns everything else in it.
    location = /api/v1/health {
        proxy_pass http://sec_backend;
        proxy_set_header Host $host;
        access_log off;
    }
}
